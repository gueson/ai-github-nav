<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="GitHub AI Navigator" />
    <link rel="canonical" href="https://www.githubnav.online/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" sizes="180x180" />
    <link rel="mask-icon" href="/favicon.svg" color="#3b82f6" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="dns-prefetch" href="https://github.com" />
    <link rel="dns-prefetch" href="https://avatars.githubusercontent.com" />
    
    <!-- Primary Meta Tags -->
    <title>GitHub AI Navigator - Curated Top AI Open Source Projects</title>
    <meta name="title" content="GitHub AI Navigator - Curated Top AI Open Source Projects" />
    <meta name="description" content="Discover top AI open source projects on GitHub. Curated machine learning, deep learning, LLM, AI agents, and AI tools." />
    <meta name="keywords" content="AI GitHub projects, machine learning, deep learning, LLM, AI agents, open source AI" />
    <meta name="author" content="GitHub AI Nav" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.githubnav.online/" />
    <meta property="og:site_name" content="GitHub AI Navigator" />
    <meta property="og:title" content="GitHub AI Navigator - Curated Top AI Open Source Projects" />
    <meta property="og:description" content="Discover top AI open source projects on GitHub. Curated machine learning, deep learning, LLM, and AI tools." />
    <meta property="og:image" content="https://www.githubnav.online/og-image.png" />
    <meta property="og:image:secure_url" content="https://www.githubnav.online/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.githubnav.online/" />
    <meta property="twitter:site" content="@GitHubAINav" />
    <meta property="twitter:creator" content="@GitHubAINav" />
    <meta property="twitter:title" content="GitHub AI Navigator - Curated Top AI Open Source Projects" />
    <meta property="twitter:description" content="Discover top AI open source projects on GitHub. Curated machine learning, deep learning, LLM, and AI tools." />
    <meta property="twitter:image" content="https://www.githubnav.online/og-image.png" />
    <meta property="twitter:image:alt" content="GitHub AI Navigator - Curated Top AI Open Source Projects" />

    <!-- Schema.org 结构化数据 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "GitHub AI Navigator",
      "description": "Discover top AI open source projects on GitHub. Curated machine learning, deep learning, LLM, and AI tools.",
      "url": "https://www.githubnav.online/",
      "publisher": {
        "@type": "Organization",
        "name": "GitHub AI Nav",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.githubnav.online/logo.png"
        }
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.githubnav.online/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "inLanguage": "en-US",
      "keywords": ["AI GitHub", "machine learning", "deep learning", "LLM", "open source AI"]
    }
    </script>



  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
